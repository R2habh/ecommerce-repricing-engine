[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-repricing-engine"
version = "0.1.0"
description = "Rule-based ecommerce repricing engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pandas",
    "rapidfuzz",
    "python-dotenv",
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]