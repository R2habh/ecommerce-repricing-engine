      <text x="200" y="450" fill="#2c3e50">79</text>
      <text x="320" y="450" fill="#e74c3c">₹2,890</text>
      <text x="460" y="450" fill="#e74c3c">+2.1%</text>
      <text x="640" y="450" fill="#2c3e50">INR</text>
      
      <text x="20" y="490" fill="#2c3e50">SHEIN</text>
      <text x="200" y="490" fill="#2c3e50">60</text>
      <text x="320" y="490" fill="#e74c3c">₹890</text>
      <text x="460" y="490" fill="#27ae60">-1.8%</text>
      <text x="640" y="490" fill="#2c3e50">INR</text>
      
      <text x="20" y="530" fill="#2c3e50">Lazada</text>
      <text x="200" y="530" fill="#2c3e50">60</text>
      <text x="320" y="530" fill="#e74c3c">₹1,650</text>
      <text x="460" y="530" fill="#e74c3c">+0.5%</text>
      <text x="640" y="530" fill="#2c3e50">INR</text>
      
      <text x="20" y="570" fill="#2c3e50">Amazon_List_Price</text>
      <text x="200" y="570" fill="#2c3e50">42</text>
      <text x="320" y="570" fill="#e74c3c">₹3,150</text>
      <text x="460" y="570" fill="#e74c3c">+8.9%</text>
      <text x="640" y="570" fill="#2c3e50">INR</text>
      
      <text x="20" y="610" fill="#2c3e50">Lazada_List_Price</text>
      <text x="200" y="610" fill="#2c3e50">32</text>
      <text x="320" y="610" fill="#e74c3c">₹1,890</text>
      <text x="460" y="610" fill="#e74c3c">+5.2%</text>
